# Authoritative OpenAPI contract of the catalog REST API (feature 005, T015).
openapi: 3.0.3
info:
  title: Torg Codex Catalog API
  version: 1.0.0
  description: 'Authoritative contract of the catalog REST API (constitution Principle III, ADR-006). The 14 product-bound
    collections apply domain-level product-ownership DRM (ADR-019): every caller owns the free tier core-rulebook
    plus the products of its ROLE_<codex-id> authorities. Articles, publications and tags are public reference data.'
paths:
  /api/articles:
    get:
      operationId: listArticles
      tags:
      - articles
      summary: Lists articles.
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleSummary'
  /api/articles/{id}:
    get:
      operationId: getArticle
      tags:
      - articles
      summary: Reads an article.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '404':
          description: No such entry. No body.
        '400':
          description: The id is not a valid UUID. No body.
  /api/cosms:
    get:
      operationId: listCosms
      tags:
      - cosms
      summary: Lists cosms the caller may read (only entries assigned to an owned product; never teasers).
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CosmSummary'
  /api/cosms/{id}:
    get:
      operationId: getCosm
      tags:
      - cosms
      summary: Reads a cosm.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosmDetail'
        '403':
          description: 'The entry exists but the caller owns none of its products: purchase teaser.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryTeaser'
        '404':
          description: No such entry, or the entry has no product assignment (indistinguishable). No body.
        '400':
          description: The id is not a valid UUID. No body.
  /api/items:
    get:
      operationId: listItems
      tags:
      - items
      summary: Lists items the caller may read (only entries assigned to an owned product; never teasers).
