components:
  schemas:
    ClearanceLevel:
      type: string
      nullable: true
      enum:
      - ALPHA
      - BETA
      - GAMMA
      - DELTA
      - OMEGA
      - null
      description: Product clearance level.
    PublicationRef:
      type: object
      description: Reference to a publication.
      additionalProperties: false
      required:
      - id
      - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
    NullablePublicationRef:
      type: object
      description: Reference to a publication, or null if no publication is known for the codex id.
      additionalProperties: false
      required:
      - id
      - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
      nullable: true
    CosmRef:
      type: object
      description: Reference to a cosm; id is null for unknown or product-less cosms (the name then is the slug).
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
      nullable: true
    DifficultyNumber:
      type: object
      description: Difficulty number.
      additionalProperties: false
      required:
      - level
      - text
      properties:
        level:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
      nullable: true
    VehicleWeapon:
      type: object
      description: Weapon mounted on a vehicle.
      additionalProperties: false
      required:
      - weaponId
      - ammo
      - amount
      properties:
        weaponId:
          type: string
          format: uuid
          nullable: true
        ammo:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
    RequiredProduct:
      type: object
      description: A product that grants access to a teased entry.
      additionalProperties: false
      required:
      - codexId
      - publication
      properties:
        codexId:
          type: string
        publication:
          $ref: '#/components/schemas/NullablePublicationRef'
    EntryTeaser:
      type: object
      description: Purchase teaser for an entry the caller does not own (ADR-019). Carries no protected entry data.
      additionalProperties: false
      required:
      - id
      - name
      - type
      - requiredProducts
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
          - cosm
          - group
          - perk
          - spell
          - spell-list
          - miracle
          - miracle-list
          - power
          - power-list
          - threat
          - item
          - vehicle
          - race
          - shard
          description: Catalog area tag.
        requiredProducts:
          type: array
          minItems: 1
          description: Granting products, sorted ascending by codex id.
          items:
            $ref: '#/components/schemas/RequiredProduct'
    ArticleSummary:
      type: object
      description: Summary of an article.
      additionalProperties: false
      required:
      - id
      - name
      - clearanceLevel
      - publications
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        clearanceLevel:
          $ref: '#/components/schemas/ClearanceLevel'
        publications:
          type: array
          items:
            $ref: '#/components/schemas/PublicationRef'
    ArticleDetail:
      type: object
      description: Details of an article. The text is rendered with the caller's effective owned products.
      additionalProperties: false
      required:
      - id
      - name
      - clearanceLevel
      - publications
      - text
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        clearanceLevel:
          $ref: '#/components/schemas/ClearanceLevel'
        publications:
          type: array
          items:
            $ref: '#/components/schemas/PublicationRef'
        text:
          type: string
          nullable: true
    CosmSummary:
      type: object
      description: Summary of a cosm.
      additionalProperties: false
      required:
      - id
      - name
      - cosm
      - clearanceLevel
      - publications
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cosm:
          $ref: '#/components/schemas/CosmRef'
        clearanceLevel:
          $ref: '#/components/schemas/ClearanceLevel'
