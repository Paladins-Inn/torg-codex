spring:
  application:
    name: torg-codex
    version: "@project.version@"
    # noinspection SpringBootApplicationYaml
    description: "@project.description@"

  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 4
      validation-timeout: 30000
      connection-test-query: "SELECT 1"
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  jackson:
    datatype:
      enum:
        write-enums-using-to-string: true
        read-enums-using-to-string: true

gg:
  jte:
    use-precompiled-templates: true
    development-mode: false

drivethru:
  library:
    cache:
      ttl: ${DRIVETHRU_LIBRARY_CACHE_TTL:12h}
      max-size: ${DRIVETHRU_LIBRARY_CACHE_MAX_SIZE:1000}
    sync:
      executor:
        core-size: ${DRIVETHRU_LIBRARY_SYNC_THREADS:4}
        queue-capacity: ${DRIVETHRU_LIBRARY_SYNC_QUEUE:100}

torg:
  codex:
    notifications:
      sse-timeout: ${TORG_CODEX_NOTIFICATION_SSE_TIMEOUT:30m}
    web:
      cors:
        allowed-origins: ${TORG_CODEX_WEB_CORS_ALLOWED_ORIGINS:}

logging:
  # Spring Boot native structured JSON logging in ECS format (ADR-017, ADR-022, constitution Principle VII).
  # Production emits console logs only (no file logging in production). File logging is restricted to
  # local dev/test profiles. Production defaults to INFO (ADR-022); enable DEBUG/TRACE selectively at runtime.
  structured:
    format:
      console: ecs
  level:
    root: info

management:
  observations:
    annotations:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
      enabled: false
  endpoint:
    health:
      group:
        liveness:
          include:
          - livenessState
          show-details: always
        readiness:
          include:
          - readinessState
          - db
          - mail
          show-details: always
      probes:
        enabled: true
      show-details: always
      validate-group-membership: false
      cache:
        time-to-live: 5s
    info:
      cache:
        time-to-live: 5s
    metrics:
      cache:
        time-to-live: 5s
    loggers:
      access: read_only
  endpoints:
    web:
      discovery:
        enabled: true
      exposure:
        include:
          - info
          - health
          - metrics
          - prometheus
          - loggers
          - liquidbase
          - hikari
          - quartz
