spring:
  application:
    name: torg-codex
    version: "@project.version@"
    # noinspection SpringBootApplicationYaml
    description: "@project.description@"

  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 4
      validation-timeout: 30000
      connection-test-query: "SELECT 1"
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  jackson:
    datatype:
      enum:
        write-enums-using-to-string: true
        read-enums-using-to-string: true

gg:
  jte:
    use-precompiled-templates: true
    development-mode: false

logging:
  # Spring Boot native structured JSON logging in ECS format (ADR-017, ADR-022, constitution Principle VII).
  # No Logstash-specific encoder is used. Production defaults to INFO (ADR-022); enable DEBUG/TRACE
  # selectively via the dev profile or runtime configuration during 2nd/3rd-level support diagnostics.
  structured:
    format:
      console: ecs
  level:
    root: info

management:
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
      enabled: false
  endpoint:
    health:
      group:
        liveness:
          include:
          - livenessState
          show-details: always
        readiness:
          include:
          - readinessState
          - db
          - mail
          show-details: always
      probes:
        enabled: true
      show-details: always
      validate-group-membership: false
      cache:
        time-to-live: 5s
    info:
      cache:
        time-to-live: 5s
    metrics:
      cache:
        time-to-live: 5s
    loggers:
      access: read_only
  endpoints:
    web:
      discovery:
        enabled: true
      exposure:
        include:
          - info
          - health
          - metrics
          - prometheus
          - loggers
          - logfile
          - liquidbase
          - hikari
          - quartz
