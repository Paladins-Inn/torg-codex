  - changeSet:
      id: 2026-09-13-001-expand
      author: klenkes74 (with codex)
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE torg_item_cosms (item_id uuid NOT NULL REFERENCES torg_item(id) ON DELETE CASCADE, cosm varchar(128) NOT NULL, PRIMARY KEY (item_id, cosm));
              CREATE INDEX idx_item_cosms_cosm ON torg_item_cosms(cosm);
              CREATE TABLE torg_miracle_list_cosms (list_id uuid NOT NULL REFERENCES torg_miracle_list(id) ON DELETE CASCADE, cosm varchar(128) NOT NULL, PRIMARY KEY (list_id, cosm));
              CREATE INDEX idx_miracle_list_cosms_cosm ON torg_miracle_list_cosms(cosm);
              CREATE TABLE torg_perk_cosms (perk_id uuid NOT NULL REFERENCES torg_perk(id) ON DELETE CASCADE, cosm varchar(128) NOT NULL, PRIMARY KEY (perk_id, cosm));
              CREATE INDEX idx_perk_cosms_cosm ON torg_perk_cosms(cosm);
              CREATE TABLE torg_power_list_cosms (list_id uuid NOT NULL REFERENCES torg_power_list(id) ON DELETE CASCADE, cosm varchar(128) NOT NULL, PRIMARY KEY (list_id, cosm));
              CREATE INDEX idx_power_list_cosms_cosm ON torg_power_list_cosms(cosm);
              CREATE TABLE torg_shard_cosms (shard_id uuid NOT NULL REFERENCES torg_shard(id) ON DELETE CASCADE, cosm varchar(128) NOT NULL, PRIMARY KEY (shard_id, cosm));
              CREATE INDEX idx_shard_cosms_cosm ON torg_shard_cosms(cosm);
              CREATE TABLE torg_spell_list_cosms (list_id uuid NOT NULL REFERENCES torg_spell_list(id) ON DELETE CASCADE, cosm varchar(128) NOT NULL, PRIMARY KEY (list_id, cosm));
              CREATE INDEX idx_spell_list_cosms_cosm ON torg_spell_list_cosms(cosm);
              CREATE TABLE torg_threat_cosms (threat_id uuid NOT NULL REFERENCES torg_threat(id) ON DELETE CASCADE, cosm varchar(128) NOT NULL, PRIMARY KEY (threat_id, cosm));
              CREATE INDEX idx_threat_cosms_cosm ON torg_threat_cosms(cosm);
              CREATE TABLE torg_vehicle_cosms (vehicle_id uuid NOT NULL REFERENCES torg_vehicle(id) ON DELETE CASCADE, cosm varchar(128) NOT NULL, PRIMARY KEY (vehicle_id, cosm));
              CREATE INDEX idx_vehicle_cosms_cosm ON torg_vehicle_cosms(cosm);
              CREATE TABLE torg_miracle_list_unlocking_perks (list_id uuid NOT NULL REFERENCES torg_miracle_list(id) ON DELETE CASCADE, perk_slug varchar(128) NOT NULL, PRIMARY KEY (list_id, perk_slug));
              CREATE INDEX idx_miracle_list_unlocking_perks_slug ON torg_miracle_list_unlocking_perks(perk_slug);
              CREATE TABLE torg_power_list_unlocking_perks (list_id uuid NOT NULL REFERENCES torg_power_list(id) ON DELETE CASCADE, perk_slug varchar(128) NOT NULL, PRIMARY KEY (list_id, perk_slug));
              CREATE INDEX idx_power_list_unlocking_perks_slug ON torg_power_list_unlocking_perks(perk_slug);
              CREATE TABLE torg_spell_list_unlocking_perks (list_id uuid NOT NULL REFERENCES torg_spell_list(id) ON DELETE CASCADE, perk_slug varchar(128) NOT NULL, PRIMARY KEY (list_id, perk_slug));
              CREATE INDEX idx_spell_list_unlocking_perks_slug ON torg_spell_list_unlocking_perks(perk_slug);

  - changeSet:
      id: 2026-09-13-002-migrate-references
      author: klenkes74 (with codex)
      changes:
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO torg_item_cosms SELECT id, trim(both '''" ' from value) FROM torg_item CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from cosm), '\s*,\s*') value WHERE cosm IS NOT NULL AND btrim(cosm) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_miracle_list_cosms SELECT id, trim(both '''" ' from value) FROM torg_miracle_list CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from cosm), '\s*,\s*') value WHERE cosm IS NOT NULL AND btrim(cosm) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_perk_cosms SELECT id, trim(both '''" ' from value) FROM torg_perk CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from cosm), '\s*,\s*') value WHERE cosm IS NOT NULL AND btrim(cosm) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_power_list_cosms SELECT id, trim(both '''" ' from value) FROM torg_power_list CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from cosm), '\s*,\s*') value WHERE cosm IS NOT NULL AND btrim(cosm) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_shard_cosms SELECT id, trim(both '''" ' from value) FROM torg_shard CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from cosm), '\s*,\s*') value WHERE cosm IS NOT NULL AND btrim(cosm) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_spell_list_cosms SELECT id, trim(both '''" ' from value) FROM torg_spell_list CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from cosm), '\s*,\s*') value WHERE cosm IS NOT NULL AND btrim(cosm) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_threat_cosms SELECT id, trim(both '''" ' from value) FROM torg_threat CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from cosm), '\s*,\s*') value WHERE cosm IS NOT NULL AND btrim(cosm) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_vehicle_cosms SELECT id, trim(both '''" ' from value) FROM torg_vehicle CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from cosm), '\s*,\s*') value WHERE cosm IS NOT NULL AND btrim(cosm) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_miracle_list_unlocking_perks SELECT id, trim(both '''" ' from value) FROM torg_miracle_list CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from unlocking_perk), '\s*,\s*') value WHERE unlocking_perk IS NOT NULL AND btrim(unlocking_perk) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_power_list_unlocking_perks SELECT id, trim(both '''" ' from value) FROM torg_power_list CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from unlocking_perk), '\s*,\s*') value WHERE unlocking_perk IS NOT NULL AND btrim(unlocking_perk) <> '' ON CONFLICT DO NOTHING;
              INSERT INTO torg_spell_list_unlocking_perks SELECT id, trim(both '''" ' from value) FROM torg_spell_list CROSS JOIN LATERAL regexp_split_to_table(trim(both '[]' from unlocking_perk), '\s*,\s*') value WHERE unlocking_perk IS NOT NULL AND btrim(unlocking_perk) <> '' ON CONFLICT DO NOTHING;

