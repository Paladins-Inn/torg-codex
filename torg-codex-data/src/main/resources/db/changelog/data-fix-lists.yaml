databaseChangeLog:
  # Expand phase (ADR-012): introduce a stable slug for every cosm and normalise
  # the slug references stored in the entity tables.
  #
  # Background: entity tables reference their cosm by slug (e.g. "living-land"),
  # while torg_cosm only carried the human-readable display name ("Living Land").
  # The reference lookup therefore matched by name and silently degraded to a
  # null-id placeholder. The slug is now a first-class column: filtering and
  # comparison use the slug, presentation uses the name.
  - changeSet:
      id: "data-fix-lists"
      author: klenkes74 (with codex)
      comment: >-
        - Add the cosm slug to the torg_cosm table. The slug is a stable identifier for the cosm, used
          for filtering and comparison.
        - Populate the cosm slugs matching the references used by the entity tables.
        - Normalise cosm references that were imported as display names instead of
          slugs. Affects every entity table carrying a cosm column.
        - Enforce slug uniqueness once every cosm carries one.

      changes:
        - addColumn:
            tableName: torg_cosm
            columns:
              - column:
                  name: slug
                  type: varchar(128)
        - update:
            tableName: torg_cosm
            columns:
              - column:
                  name: slug
                  value: aysle
            where: id = '6cf031c3-ab0a-4d12-9173-91d74f7c809f'
