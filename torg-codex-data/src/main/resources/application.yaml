spring:
  datasource:
    hikari:
      minimum-idle: 2
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

drivethru:
  base-url: https://www.drivethrurpg.com/api/v1
  connect-timeout: 5s
  read-timeout: 10s

logging:
  structured:
    format:
      console: ecs

